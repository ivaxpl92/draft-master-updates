name: Build Draft Master 1.0.9
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-draft-master-109.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'
          cache: false
      - name: Build and publish the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          site=https://draft-master-ivax.piledminnow2.chatgpt.site
          curl -fsSL --retry 3 "$site/releases/1.0.8/Draft-Master-1.0.8-Windows.zip" -o previous.zip
          unzip -q previous.zip
          curl -fsSL --retry 3 "$site/releases/1.0.9/Draft-Master-1.0.9.html.gz" -o app.html.gz
          gzip -dc app.html.gz > Zrodla/app.html
          echo 'b61cc986be96e4ea89429490a0e312541751c92fff4ff60cdd0b2f69d958b73e  Zrodla/app.html' | sha256sum -c -
          sed -i 's/const appVersion = "1.0.8"/const appVersion = "1.0.9"/' Zrodla/update.go
          grep -Fx 'const appVersion = "1.0.9"' Zrodla/update.go
          cd Zrodla
          go test ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-H windowsgui -s -w" -o ../Draft-Master.exe .
          cd ..
          file Draft-Master.exe | grep -E 'PE32\+.*x86-64'
          sha256sum Draft-Master.exe
          gh release create v1.0.9 Draft-Master.exe --target "$GITHUB_SHA" --title 'Draft Master 1.0.9' --notes 'Parowanie priorytetu linii z junglą, korekta blinda, nowe duety i globalna czołówka picków.'
          mkdir download-check
          gh release download v1.0.9 -p Draft-Master.exe -D download-check
          cmp Draft-Master.exe download-check/Draft-Master.exe
          digest=$(sha256sum Draft-Master.exe | cut -d' ' -f1)
          jq -n --arg digest "$digest" --arg html "$site/releases/1.0.9/Draft-Master-1.0.9.html" --arg exe "https://github.com/$GH_REPO/releases/download/v1.0.9/Draft-Master.exe" '{version:"1.0.9",notes:"Priorytet linii dla jungli, nowe duety, korekta blinda oraz globalne rekomendacje.",windows_url:$exe,sha256:$digest,html_url:$html}' > release-feed.json
          gh api -X PUT "repos/$GH_REPO/contents/latest.json" -f message='Publish Draft Master 1.0.9 update feed' -f sha=7fba9517ec1cc9c05b01a37732ddd10643a2b826 -f content="$(base64 -w0 release-feed.json)" --jq .commit.sha
