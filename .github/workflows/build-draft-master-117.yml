name: Build Draft Master 1.0.17
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-draft-master-117.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'
          cache: false
      - name: Verify, build and publish Windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          site=https://draft-master-ivax.piledminnow2.chatgpt.site
          curl -fsSL --retry 3 "$site/releases/1.0.17/Draft-Master-1.0.17-source.zip" -o source.zip
          echo '44edb4114673f786a3ee64ebe85f4a80379f285afd00694a2d7576630ec7f8b9  source.zip' | sha256sum -c -
          unzip -q source.zip
          cd Zrodla
          go test ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-H windowsgui -s -w" -o ../Draft-Master.exe .
          cd ..
          file Draft-Master.exe | grep -E 'PE32\+.*x86-64'
          zip -q -r Draft-Master-1.0.17-Windows.zip Draft-Master.exe Zrodla Licencje START.txt AKTUALIZACJE.txt
          gh release create v1.0.17 Draft-Master.exe Draft-Master-1.0.17-Windows.zip source.zip --target "$GITHUB_SHA" --title 'Draft Master 1.0.17' --notes 'Plan ratunkowy po kontrze liniowej -6: przeniesienie gry na dostępną linię, ratunkowy mid i użytkowy jungler. Powrót do pierwotnego core bez innych opcji. Kontry, tiery i CP bez zmian.'
          mkdir verify-download
          gh release download v1.0.17 -p Draft-Master.exe -D verify-download
          cmp Draft-Master.exe verify-download/Draft-Master.exe
          digest=$(sha256sum Draft-Master.exe | cut -d' ' -f1)
          jq -n --arg digest "$digest" --arg html "$site/releases/1.0.17/Draft-Master-1.0.17.html" --arg exe "https://github.com/$GH_REPO/releases/download/v1.0.17/Draft-Master.exe" '{version:"1.0.17",notes:"Plan ratunkowy po przegranej linii -6 i poprawiony licznik partnerów carry.",windows_url:$exe,sha256:$digest,html_url:$html}' > release-feed.json
          feedsha=$(gh api "repos/$GH_REPO/contents/latest.json" --jq .sha)
          gh api -X PUT "repos/$GH_REPO/contents/latest.json" -f message='Publish Draft Master 1.0.17 update feed' -f sha="$feedsha" -f content="$(base64 -w0 release-feed.json)" --jq .commit.sha
